name: Publish completed audio
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Generation run ID containing completed audio artifacts'
        required: true
        type: string
      date:
        description: 'Starting date used by the generation run (YYYY-MM-DD)'
        required: true
        type: string
concurrency:
  group: daily-office-audio
  cancel-in-progress: false
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          pattern: audio-*
          merge-multiple: true
          path: output
      - name: Validate and publish complete dates
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUEST_DATE: ${{ inputs.date }}
        run: python publish.py --date "$REQUEST_DATE"
