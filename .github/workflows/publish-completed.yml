name: Publish completed audio
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Generation run ID containing completed audio artifacts'
        required: true
        type: string
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          pattern: audio-*
          merge-multiple: true
          path: output
      - name: Publish completed recordings
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for folder in output/*; do
            date=$(basename "$folder")
            tag="office-$date"
            if ! gh release view "$tag" >/dev/null 2>&1; then
              gh release create "$tag" --title "Daily Office — $date" --notes 'Michael and Heart readings. BCP 1979; public-domain scripture text supplied by Gracelight. Synthetic speech generated with Kokoro. Prepared for St. Peter’s Episcopal Church, Brenham.' --latest=false
            fi
            gh release upload "$tag" "$folder"/*.mp3 "$folder"/*.json --clobber
          done
