name: Prepare Daily Office voices
on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Optional starting date (YYYY-MM-DD); defaults to today in Brenham'
        required: false
        default: ''
  schedule:
    - cron: '17 8 * * *'
  push:
    branches: [main]
    paths:
      - 'generate.py'
      - 'study.py'
      - 'publish.py'
      - 'requirements.txt'
      - '.github/workflows/daily-audio.yml'
permissions:
  contents: read
concurrency:
  group: daily-office-audio
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.date.outputs.date }}
    steps:
      - id: date
        env:
          REQUEST_DATE: ${{ inputs.date }}
        run: |
          python - <<'PYTHON'
          import datetime as dt
          import os
          from zoneinfo import ZoneInfo
          requested = os.environ.get('REQUEST_DATE', '')
          date = dt.date.fromisoformat(requested) if requested else dt.datetime.now(ZoneInfo('America/Chicago')).date()
          if requested and date.isoformat() != requested:
              raise ValueError('Use YYYY-MM-DD')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'date={date.isoformat()}\n')
          PYTHON
  generate:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {office: morning-prayer, rite: Rite-II}
          - {office: morning-prayer, rite: Rite-I}
          - {office: evening-prayer, rite: Rite-II}
          - {office: evening-prayer, rite: Rite-I}
          - {office: noonday-prayer, rite: Rite-II}
          - {office: compline, rite: Rite-II}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install speech engine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y espeak-ng ffmpeg
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Prepare today and tomorrow
        env:
          REQUEST_DATE: ${{ needs.plan.outputs.date }}
          OFFICE: ${{ matrix.office }}
          RITE: ${{ matrix.rite }}
        run: python generate.py --office "$OFFICE" --rite "$RITE" --date "$REQUEST_DATE"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && !cancelled() }}
        with:
          name: audio-${{ matrix.office }}-${{ matrix.rite }}
          path: output/
          retention-days: 3
          if-no-files-found: error
  publish:
    needs: [plan, generate]
    if: ${{ always() && !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: audio-*
          merge-multiple: true
          path: output
      - name: Validate and publish complete dates
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUEST_DATE: ${{ needs.plan.outputs.date }}
        run: python publish.py --date "$REQUEST_DATE"
